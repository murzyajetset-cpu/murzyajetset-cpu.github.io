<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КП DARAMs — LU4 GAMMA</title>
<style>
  body { font-family: Arial, sans-serif; background: #1e1e1e; color: #eee; margin: 20px; }
  h1 { color: #f0c040; }
  .toolbar { margin-bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  button { padding: 8px 12px; border: none; border-radius: 4px; background: #3a3a3a; color: #eee; cursor: pointer; }
  button:hover { background: #505050; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 1300px; }
  th, td { border: 1px solid #444; padding: 4px; text-align: left; vertical-align: middle; }
  th { background: #2a2a2a; color: #f0c040; position: sticky; top: 0; }
  input, select { background: #2b2b2b; color: #eee; border: 1px solid #555; border-radius: 3px; padding: 4px; width: 100%; box-sizing: border-box; }
  input[type="number"] { width: 70px; }
  .remove-btn { background: #a33; color: white; padding: 4px 8px; }
  .remove-btn:hover { background: #c44; }
  .empty { color: #888; font-style: italic; }
  .set-panel { margin-top: 20px; padding: 15px; background: #252525; border-radius: 8px; border-left: 4px solid #f0c040; display: none; }
  .set-panel.active { display: block; }
  .set-panel h2 { margin: 0 0 10px 0; color: #f0c040; font-size: 1.2em; }
  .set-panel h3 { margin: 15px 0 8px 0; color: #9cd; font-size: 1em; border-bottom: 1px solid #444; padding-bottom: 4px; }
  .set-panel h3:first-of-type { margin-top: 0; }
  .set-panel .missing { color: #e88; }
  .set-panel .complete { color: #8e8; font-weight: bold; }
  .set-panel .bonus-list { margin: 8px 0 0 0; padding-left: 20px; }
  .set-panel .bonus-list li { margin-bottom: 4px; }
  .set-label { font-size: 0.75em; color: #aaa; margin: 2px 0 1px 0; display: block; }
  .set-cell { min-width: 140px; }
  .set-cell select { margin-bottom: 2px; }
  .set-cell .set-group-title { font-size: 0.8em; color: #f0c040; margin-top: 6px; }
  .set-cell .set-group-title:first-child { margin-top: 0; }
</style>
</head>
<body>

<h1>Группа Lineage 2 — Сеты брони и бижутерии</h1>

<div class="toolbar">
  <button id="addMember">Добавить персонажа</button>
  <button id="save">Сохранить</button>
  <button id="load">Загрузить</button>
  <button id="export">Экспорт JSON</button>
  <button id="clear">Очистить</button>
</div>

<div class="table-wrap">
  <table id="partyTable">
    <thead>
      <tr>
        <th>Имя</th>
        <th>Класс</th>
        <th>Ур.</th>
        <th>Оружие</th>
        <th>Сет брони<br><span class="set-label">(шлем / броня / перчатки / ботинки / щит)</span></th>
        <th>Сет бижутерии<br><span class="set-label">(серьга ×2 / ожерелье / кольцо ×2)</span></th>
        <th></th>
      </tr>
    </thead>
    <tbody id="partyBody"></tbody>
  </table>
</div>

<div id="setPanel" class="set-panel">
  <h2 id="setTitle">Сеты не определены</h2>
  <div id="setContent"></div>
</div>

<script>
  // ==================== БАЗА СЕТОВ БРОНИ ====================
  const armorSets = [

    {

      type: 'Light',

    },
    {

      type: 'Heavy',

      bonuses: [

        'Resistance to Sleep/Hold +70%',
        'При заточке всех частей на +6: P. Def. и MP Recovery увеличены'
      ]
    },
    {
      id: 'vesper_light',
      name: 'Vesper Light Set',
      type: 'Light',
      pieces: {
        helmet: 'Vesper Leather Helmet',
        armor: 'Vesper Leather Armor',
        gloves: 'Vesper Leather Gloves',
        boots: 'Vesper Leather Boots',
        shield: ''
      },
      bonuses: [

      ]
    },
    {

      type: 'Heavy',
      pieces: {

        armor: 'Elegia Breastplate',
        gloves: 'Elegia Gauntlets',

        shield: 'Elegia Shield'
      },
      bonuses: [

        'Resistance to Bleed/Hold/Sleep +50%',
        'Resistance to Magic Damage +2%',
        'Max HP +550',

      ]
    },
    {

      name: 'Elegia Light Set',
      type: 'Light',
      pieces: {
        helmet: 'Elegia Leather Helmet',
        armor: 'Elegia Leather Armor',
        gloves: 'Elegia Leather Gloves',
        boots: 'Elegia Leather Boots',
        shield: ''
      },
      bonuses: [
        'STR +1, DEX +2, CON -2',
        'P. Atk. +6.59%, Attack Speed +6%',
        'Critical Rate +171',
        'Resistance to Paralysis +50%',
        'Speed +3%',

      ]
    }
  ];

  // ==================== БАЗА СЕТОВ БИЖУТЕРИИ ====================
  const jewelrySets = [
    {
      id: 'dynasty_jewelry',
      name: 'Dynasty Jewelry Set',
      pieces: {
        earring1: 'Dynasty Earring',
        earring2: 'Dynasty Earring',
        necklace: 'Dynasty Necklace',
        ring1: 'Dynasty Ring',
        ring2: 'Dynasty Ring'
      },
      bonuses: [

        'Resistance to Poison +20%',
        'Resistance to Bleed +20%',
        'При заточке всех частей на +6: M. Def. +15'
      ]
    },
    {
      id: 'vesper_jewelry',
      name: 'Vesper Jewelry Set',
      pieces: {
        earring1: 'Vesper Earring',
        earring2: 'Vesper Earring',
        necklace: 'Vesper Necklace',
        ring1: 'Vesper Ring',
        ring2: 'Vesper Ring'
      },
      bonuses: [
        'M. Def. +7',
        'Max MP +200',
        'Resistance to Poison +30%',
        'Resistance to Bleed +30%',
        'При заточке всех частей на +6: M. Def. +20'
      ]
    },
    {
      id: 'elegia_jewelry',
      name: 'Elegia Jewelry Set',
      pieces: {
        earring1: 'Elegia Earring',
        earring2: 'Elegia Earring',
        necklace: 'Elegia Necklace',
        ring1: 'Elegia Ring',
        ring2: 'Elegia Ring'
      },
      bonuses: [
        'M. Def. +10',
        'Max MP +250',
        'Resistance to Poison +40%',
        'Resistance to Bleed +40%',
        'Resistance to Stun +30%',
        'При заточке всех частей на +6: M. Def. +25'
      ]
    },
    {
      id: 'epic_earring_combo',
      name: 'Epic Earring Combo (Zaken + Antharas)',
      pieces: {
        earring1: "Blessed Zaken's Earring",
        earring2: "Blessed Antharas' Earring"
      },
      bonuses: [
        'M. Def. +10, Max MP +300',
        'Resistance to Bleed +30%',
        'Resistance to Stun +30%',
        'Восстанавливает 3% MP при получении урона'
      ]
    },
    {
      id: 'epic_ring_combo',
      name: 'Epic Ring Combo (Baium + Ant Queen)',
      pieces: {
        ring1: 'Ring of Baium',
        ring2: 'Ring of Queen Ant'
      },
      bonuses: [
        'M. Def. +8, Max MP +250',
        'Resistance to Poison +30%',
        'Resistance to Hold +30%',
        'Увеличивает точность и критический удар'
      ]
    },
    {
      id: 'epic_necklace_combo',
      name: 'Epic Necklace Combo (Valakas + Frintezza)',
      pieces: {
        necklace: "Blessed Valakas' Necklace",
        necklace2: 'Necklace of Frintezza'
      },
      bonuses: [
        'M. Def. +12, Max MP +350',
        'Resistance to Sleep +40%',
        'Resistance to Paralysis +40%'
      ]
    }
  ];

  // ==================== СПИСКИ ПРЕДМЕТОВ ====================
  function buildArmorList(slot) {
    const items = new Set(['']);
    armorSets.forEach(set => {
      const item = set.pieces[slot];
      if (item) items.add(item);
    });
    return Array.from(items).sort((a, b) => a.localeCompare(b));
  }

  function buildJewelryList(slot) {
    const items = new Set(['']);
    jewelrySets.forEach(set => {
      const item = set.pieces[slot];
      if (item) items.add(item);
    });
    // Одиночные эпические предметы, не входящие в полные сеты
    const singles = {
      earring1: ["Blessed Zaken's Earring", "Blessed Antharas' Earring", 'Earring of Orfen'],
      earring2: ["Blessed Zaken's Earring", "Blessed Antharas' Earring", 'Earring of Orfen'],
      necklace: ["Blessed Valakas' Necklace", 'Necklace of Frintezza'],
      ring1: ['Ring of Baium', 'Ring of Queen Ant'],
      ring2: ['Ring of Baium', 'Ring of Queen Ant']
    };
    if (singles[slot]) singles[slot].forEach(i => items.add(i));
    return Array.from(items).sort((a, b) => a.localeCompare(b));
  }

  const itemOptions = {
    weapon: [
      "", "Sword of Miracles", "Draconic Bow", "Dragon Hunter Axe", "Heaven's Divider",
      "Imperial Staff", "Arcana Mace", "Angel Slayer", "Tallum Blade", "Dark Legion's Edge",
      "Sirra's Blade", "Barakiel's Axe", "Soul Separator", "Flaming Dragon Skull",
      "Basalt Battlehammer", "Saint Spear", "Demon Splinter", "Dynasty Sword",
      "Icarus Hammer", "Vesper Cutter", "Eternal Core Sword"
    ],
    helmet: buildArmorList('helmet'),
    armor: buildArmorList('armor'),
    gloves: buildArmorList('gloves'),
    boots: buildArmorList('boots'),
    shield: buildArmorList('shield'),
    earring1: buildJewelryList('earring1'),
    earring2: buildJewelryList('earring2'),
    necklace: buildJewelryList('necklace'),
    ring1: buildJewelryList('ring1'),
    ring2: buildJewelryList('ring2')
  };

  const classes = [
    "", "Tank", "Healer", "DD", "Mage", "Archer", "Dagger", "Summoner", "Bard", "Support"
  ];

  // ==================== СОСТОЯНИЕ ====================
  let members = [];
  let activeMemberIndex = null;
  const partyBody = document.getElementById('partyBody');
  const setPanel = document.getElementById('setPanel');
  const setTitle = document.getElementById('setTitle');
  const setContent = document.getElementById('setContent');

  // ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
  function createSelect(options, value, onChange) {
    const select = document.createElement('select');
    options.forEach(opt => {
      const option = document.createElement('option');
      option.value = opt;
      option.textContent = opt || '— пусто —';
      if (opt === value) option.selected = true;
      select.appendChild(option);
    });
    select.addEventListener('change', e => onChange(e.target.value));
    return select;
  }

  function createInput(type, value, onChange, attrs = {}) {
    const input = document.createElement('input');
    input.type = type;
    input.value = value;
    Object.assign(input, attrs);
    input.addEventListener('input', e => onChange(e.target.value));
    return input;
  }

  // Универсальная функция определения сета по списку слотов.
  // Возвращает:
  //   { set, missing: [] } — полный сет;
  //   { set, missing: [...], matchedCount, totalRequired } — частичный сет;
  //   null — ничего не подходит.
  function detectSet(member, setsList, slots) {
    const selected = {};
    slots.forEach(s => { selected[s] = member[s] || ''; });

    let bestPartial = null;

    for (const set of setsList) {
      let missing = [];
      let matchedCount = 0;
      let totalRequired = 0;
      let hasForeignItem = false;

      for (const slot of slots) {
        const setItem = set.pieces[slot];
        const chosen = selected[slot];

        if (setItem) {
          totalRequired++;
          if (chosen === setItem) {
            matchedCount++;
          } else if (chosen === '') {
            missing.push(slot);
          } else {
            hasForeignItem = true;
          }
        } else {
          if (chosen) hasForeignItem = true;
        }
      }

      if (!hasForeignItem && matchedCount === totalRequired && totalRequired > 0) {
        return { set, missing: [] };
      }
      if (!hasForeignItem && matchedCount > 0 && matchedCount < totalRequired) {
        if (!bestPartial || matchedCount > bestPartial.matchedCount) {
          bestPartial = { set, missing, matchedCount, totalRequired };
        }
      }
    }
    return bestPartial;
  }

  const armorSlots = ['helmet', 'armor', 'gloves', 'boots', 'shield'];
  const jewelrySlots = ['earring1', 'earring2', 'necklace', 'ring1', 'ring2'];
  const slotNames = {
    helmet: 'шлем', armor: 'броня', gloves: 'перчатки', boots: 'ботинки', shield: 'щит',
    earring1: 'серьга 1', earring2: 'серьга 2', necklace: 'ожерелье', ring1: 'кольцо 1', ring2: 'кольцо 2'
  };

  function renderSetSection(title, result) {
    if (!result) {
      return `<h3>${title}</h3><p class="missing">Сет не определён — выберите предметы из одного набора.</p>`;
    }
    const { set, missing, matchedCount, totalRequired } = result;
    if (missing && missing.length === 0) {
      let html = `<h3>${title}: <span class="complete">${set.name}${set.type ? ' (' + set.type + ')' : ''} — полный комплект</span></h3>`;
      html += '<ul class="bonus-list">';
      set.bonuses.forEach(b => { html += `<li>${b}</li>`; });
      html += '</ul>';
      return html;
    }
    const missingNames = missing.map(s => slotNames[s] || s).join(', ');
    return `<h3>${title}: ${set.name} — <span class="missing">не хватает: ${missingNames}</span></h3>` +
           `<p>Собрано ${matchedCount} из ${totalRequired} частей. Выберите недостающие предметы, чтобы активировать бонусы сета.</p>`;
  }

  function updateSetPanel() {
    if (activeMemberIndex === null || !members[activeMemberIndex]) {
      setPanel.classList.remove('active');
      return;
    }
    const member = members[activeMemberIndex];
    const armorResult = detectSet(member, armorSets, armorSlots);
    const jewelryResult = detectSet(member, jewelrySets, jewelrySlots);

    if (!armorResult && !jewelryResult) {
      setTitle.textContent = `Сеты не определены (${member.name || 'персонаж'})`;
      setContent.innerHTML = '<p class="missing">Выберите предметы из одного набора брони или бижутерии, чтобы увидеть бонусы.</p>';
      setPanel.classList.add('active');
      return;
    }

    setTitle.textContent = `Активный персонаж: ${member.name || 'без имени'}`;
    setContent.innerHTML =
      renderSetSection('Броня', armorResult) +
      renderSetSection('Бижутерия', jewelryResult);
    setPanel.classList.add('active');
  }

  // ==================== РЕНДЕР ТАБЛИЦЫ ====================
  function renderTable() {
    partyBody.innerHTML = '';

    if (members.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 7;
      td.className = 'empty';
      td.textContent = 'Нет персонажей. Нажмите «Добавить персонажа».';
      tr.appendChild(td);
      partyBody.appendChild(tr);
      setPanel.classList.remove('active');
      return;
    }

    members.forEach((member, index) => {
      const tr = document.createElement('tr');

      // Имя
      const tdName = document.createElement('td');
      tdName.appendChild(createInput('text', member.name, val => { member.name = val; }));
      tr.appendChild(tdName);

      // Класс
      const tdClass = document.createElement('td');
      tdClass.appendChild(createSelect(classes, member.className, val => { member.className = val; }));
      tr.appendChild(tdClass);

      // Уровень
      const tdLevel = document.createElement('td');
      tdLevel.appendChild(createInput('number', member.level, val => { member.level = val; }, { min: 1, max: 85 }));
      tr.appendChild(tdLevel);

      // Оружие
      const tdWeapon = document.createElement('td');
      tdWeapon.appendChild(createSelect(itemOptions.weapon, member.weapon || '', val => { member.weapon = val; }));
      tr.appendChild(tdWeapon);

      // Сет брони
      const tdArmor = document.createElement('td');
      tdArmor.className = 'set-cell';
      const armorFields = [
        { key: 'helmet', label: 'Шлем' },
        { key: 'armor', label: 'Броня' },
        { key: 'gloves', label: 'Перчатки' },
        { key: 'boots', label: 'Ботинки' },
        { key: 'shield', label: 'Щит' }
      ];
      armorFields.forEach(field => {
        const label = document.createElement('span');
        label.className = 'set-label';
        label.textContent = field.label;
        tdArmor.appendChild(label);
        const select = createSelect(itemOptions[field.key], member[field.key] || '', val => {
          member[field.key] = val;
          activeMemberIndex = index;
          updateSetPanel();
        });
        tdArmor.appendChild(select);
      });
      tr.appendChild(tdArmor);

      // Сет бижутерии
      const tdJewelry = document.createElement('td');
      tdJewelry.className = 'set-cell';
      const jewelryFields = [
        { key: 'earring1', label: 'Серьга 1' },
        { key: 'earring2', label: 'Серьга 2' },
        { key: 'necklace', label: 'Ожерелье' },
        { key: 'ring1', label: 'Кольцо 1' },
        { key: 'ring2', label: 'Кольцо 2' }
      ];
      jewelryFields.forEach(field => {
        const label = document.createElement('span');
        label.className = 'set-label';
        label.textContent = field.label;
        tdJewelry.appendChild(label);
        const select = createSelect(itemOptions[field.key], member[field.key] || '', val => {
          member[field.key] = val;
          activeMemberIndex = index;
          updateSetPanel();
        });
        tdJewelry.appendChild(select);
      });
      tr.appendChild(tdJewelry);

      // Удаление
      const tdRemove = document.createElement('td');
      const btnRemove = document.createElement('button');
      btnRemove.textContent = '×';
      btnRemove.className = 'remove-btn';
      btnRemove.title = 'Удалить персонажа';
      btnRemove.addEventListener('click', () => {
        members.splice(index, 1);
        if (activeMemberIndex === index) activeMemberIndex = null;
        else if (activeMemberIndex > index) activeMemberIndex--;
        renderTable();
        updateSetPanel();
      });
      tdRemove.appendChild(btnRemove);
      tr.appendChild(tdRemove);

      partyBody.appendChild(tr);
    });
  }

  // ==================== ДЕЙСТВИЯ ====================
  function addMember() {
    members.push({
      name: 'Персонаж ' + (members.length + 1),
      className: '',
      level: 1,
      weapon: '',
      helmet: '',
      armor: '',
      gloves: '',
      boots: '',
      shield: '',
      earring1: '',
      earring2: '',
      necklace: '',
      ring1: '',
      ring2: ''
    });
    renderTable();
  }

  document.getElementById('addMember').addEventListener('click', addMember);

  document.getElementById('save').addEventListener('click', () => {
    localStorage.setItem('l2party', JSON.stringify(members));
    alert('Сохранено в localStorage');
  });

  document.getElementById('load').addEventListener('click', () => {
    const data = localStorage.getItem('l2party');
    if (data) {
      try {
        members = JSON.parse(data);
        activeMemberIndex = null;
        renderTable();
        updateSetPanel();
        alert('Загружено из localStorage');
      } catch (e) {
        alert('Ошибка загрузки: ' + e.message);
      }
    } else {
      alert('Нет сохранённых данных');
    }
  });

  document.getElementById('export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(members, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'lineage2_party.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('clear').addEventListener('click', () => {
    if (confirm('Удалить всех персонажей?')) {
      members = [];
      activeMemberIndex = null;
      renderTable();
      updateSetPanel();
    }
  });

  // Стартовые персонажи
  addMember();
  addMember();
  addMember();
</script>

</body>
</html>
